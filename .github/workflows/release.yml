name: Release

on:
  push:
    tags:
      - 'v*.*.*'

env:
  ZIG_VERSION: 0.16.0

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
            binary: runlaunch.exe
            asset: runlaunch-windows-x86_64.exe
          - name: ubuntu
            os: ubuntu-latest
            binary: runlaunch
            asset: runlaunch-ubuntu-x86_64
    env:
      # Set at job level so steps can test for it: the `secrets` context is not allowed in `if`.
      MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Run tests
        run: zig build test

      - name: Build (ReleaseSafe)
        run: zig build -Doptimize=ReleaseSafe

      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          cp "zig-out/bin/${{ matrix.binary }}" "dist/${{ matrix.asset }}"
          ls -l dist

      - name: Install minisign (Windows)
        if: env.MINISIGN_SECRET_KEY != '' && runner.os == 'Windows'
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/jedisct1/minisign/releases/download/0.12/minisign-0.12-win64.zip" -OutFile "minisign.zip"
          Expand-Archive -Path "minisign.zip" -DestinationPath "$env:USERPROFILE\minisign"
          echo "$env:USERPROFILE\minisign" | Out-File -Append -Encoding ascii $env:GITHUB_PATH

      - name: Install minisign (Ubuntu)
        if: env.MINISIGN_SECRET_KEY != '' && runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y minisign

      - name: Sign
        if: env.MINISIGN_SECRET_KEY != ''
        shell: bash
        run: |
          # The key must have been generated without a password (minisign -G -W): there is no
          # terminal here to type one into. Signatures land next to the files as *.minisig.
          printf '%s\n' "$MINISIGN_SECRET_KEY" > minisign.key
          minisign -S -s minisign.key -m "dist/${{ matrix.asset }}"
          rm -f minisign.key
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}-artifacts
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish release
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: '*-artifacts'
          path: dist
          merge-multiple: true

      - name: List assets
        run: ls -l dist

      - uses: ncipollo/release-action@v1
        with:
          tag: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          artifacts: dist/*
          generateReleaseNotes: true
