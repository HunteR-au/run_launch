# runlaunch sample launch file. Try:
#   runlaunch data\launch.yml             starts `default:` (the Demo group)
#   runlaunch data\launch.yml Print       starts one process
#   runlaunch data\launch.yml Server      a process whose preTask starts alongside it
# CONFIG.md describes every field.

default: Demo

processes:
  List: ls .
  Print: .\data\printlines.py
  Control: .\data\controlchars.py
  Server: '-m http.server 8000'

groups:
  Demo: [Print, Control]

configs:
  - name: Print
    type: python
    preTask: List
  - name: Control
    type: python
  - name: Server
    type: python
    preTask: List
  - name: Demo
    # runs once both Print and Control have a view
    script:
      - 'Control: wrap on'

colorRules:
  - pattern: data
    background_color: '220,6,6'
    just_pattern: true
